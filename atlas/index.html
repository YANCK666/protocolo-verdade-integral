<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Polar — Relógio Celeste</title>
<style>
  body { background: #0b0710; color: #f0e9fb; font-family: sans-serif; margin: 0; padding: 20px; overflow-x: hidden; user-select: none; }
  h1 { font-family: serif; font-weight: 400; margin: 0 0 5px 0; }
  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 30px; max-width: 1200px; margin: 0 auto; align-items: start; }
  .map-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 1; background: #110c18; border-radius: 50%; cursor: grab; }
  .map-container:active { cursor: grabbing; }
  .map-container.locked { cursor: default; }
  .map-container.locked:active { cursor: default; }
  svg { width: 100%; height: 100%; display: block; }
  .sea { fill: #110c18; }
  .c { fill: #2e2340; stroke: #0b0710; stroke-width: 1; }
  .tropic-north { fill: none; stroke: #ef4444; stroke-width: 1.5; opacity: 0.8; }
  .tropic-equator { fill: none; stroke: #eab308; stroke-width: 1.5; opacity: 0.8; }
  .tropic-south { fill: none; stroke: #3b82f6; stroke-width: 1.5; opacity: 0.8; }
  .sun-dot { fill: #ffcc00; filter: drop-shadow(0 0 15px #ffcc00); }
  .moon-dot { fill: #e0e0e0; filter: drop-shadow(0 0 10px #fff); }
  .moon-shadow { fill: #000; }
  .pole { fill: #c4a1f0; }
  .panel { background: #15101c; padding: 20px; border-radius: 12px; border: 1px solid #3a2d4c; }
  .clock-display { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #c4a1f0; }
  .btn { width: 100%; padding: 10px; background: #221a2e; color: #f0e9fb; border: 1px solid #3a2d4c; border-radius: 6px; cursor: pointer; margin-top: 10px; }
  input[type="range"] { width: 100%; margin-top: 20px; accent-color: #c4a1f0; }
  .lock-toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>

<div class="layout">
  <div class="map-container" id="mapwrap">
    <svg id="map" viewBox="0 0 800 800">
      <defs>
        <clipPath id="mapclip"><circle cx="400" cy="400" r="372"/></clipPath>
        <clipPath id="moonclip"><circle id="moonClipCircle" cx="0" cy="0" r="12"/></clipPath>
      </defs>
      
      <circle class="sea" cx="400" cy="400" r="372" />
      
      <!-- TERRA (FIXA) -->
      <g id="landGroup" clip-path="url(#mapclip)"></g>

      <!-- CÉU (GIRA COM O SOL) -->
      <g id="skyGroup" clip-path="url(#mapclip)" pointer-events="none">
        <circle id="sun" class="sun-dot" r="12" />
        <circle id="moon" class="moon-dot" r="12" />
        <circle id="moonShadow" class="moon-shadow" r="12" clip-path="url(#moonclip)" />
      </g>

      <!-- SOMBRA -->
      <image id="nightShadow" x="0" y="0" width="800" height="800" preserveAspectRatio="none" clip-path="url(#mapclip)" />

      <!-- GRADE E TRÓPICOS -->
      <circle class="tropic-north" cx="400" cy="400" r="137.5" />
      <circle class="tropic-equator" cx="400" cy="400" r="186" />
      <circle class="tropic-south" cx="400" cy="400" r="234.5" />
      <circle class="pole" cx="400" cy="400" r="5" />
      
      <!-- ANEL DE 24H -->
      <g id="clockGroup">
        <circle cx="400" cy="400" r="385" fill="none" stroke="#3a2d4c" stroke-width="1.5" />
        <g id="clockTicks"></g>
      </g>
    </svg>
    <div id="timeTooltip" style="position: absolute; pointer-events: none; background: #15101c; border: 1px solid #3a2d4c; padding: 8px; border-radius: 6px; display: none; z-index: 100; font-size: 12px;"></div>
  </div>

  <div class="panel">
    <div class="clock-display" id="clockDisplay">--:--</div>
    
    <!-- OPÇÃO DE TRAVAR/DESTRAVAR -->
    <label class="lock-toggle">
      <input type="checkbox" id="lockToggle" checked> Travar Relógio (para consulta)
    </label>

    <div style="display:flex; gap:10px;">
      <input type="number" id="inputYear" value="2026" style="width:80px; background:#0b0710; color:#fff; border:1px solid #3a2d4c; padding:5px;">
      <input type="number" id="inputMonth" value="11" style="width:50px; background:#0b0710; color:#fff; border:1px solid #3a2d4c; padding:5px;">
      <input type="number" id="inputDay" value="23" style="width:50px; background:#0b0710; color:#fff; border:1px solid #3a2d4c; padding:5px;">
    </div>
    <input type="range" id="timeSlider" min="0" max="23.99" value="12" step="0.01">
    <button class="btn" id="btnNow">Sincronizar com o Agora</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

<script>
const Astro = (function () {
  function normaliza(graus) { return ((graus % 360) + 360) % 360; }
  function gastDeg(date) {
    const jd = date.getTime() / 86400000 + 2440587.5;
    const T = (jd - 2451545.0) / 36525.0;
    return normaliza(280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T);
  }
  function sunEquatorial(date) {
    const jd = date.getTime() / 86400000 + 2440587.5;
    const T = (jd - 2451545.0) / 36525.0;
    const L0 = normaliza(280.46646 + T * (36000.76983 + 0.0003032 * T));
    const M = normaliza(357.52911 + T * (35999.05029 - 0.0001537 * T)) * Math.PI / 180;
    const C = (1.914602 - T * (0.004817 + 0.000014 * T)) * Math.sin(M) + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
    const omega = (125.04 - 1934.136 * T) * Math.PI / 180;
    const lambda = (L0 + C - 0.00569 - 0.00478 * Math.sin(omega)) * Math.PI / 180;
    const eps = (23.439291 - 0.0130042 * T) * Math.PI / 180;
    const dec = Math.asin(Math.sin(eps) * Math.sin(lambda));
    const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda));
    return { ra: normaliza(ra * 180 / Math.PI), dec: dec * 180 / Math.PI };
  }
  function moonEquatorial(date) {
    const jd = date.getTime() / 86400000 + 2440587.5;
    const T = (jd - 2451545.0) / 36525.0;
    const L = normaliza(218.316 + 481267.881 * T);
    const M = normaliza(134.963 + 477198.867 * T) * Math.PI / 180;
    const F = normaliza(93.272 + 483202.017 * T) * Math.PI / 180;
    const lambda = (L + 6.289 * Math.sin(M)) * Math.PI / 180;
    const beta = 5.128 * Math.sin(F) * Math.PI / 180;
    const eps = (23.439291 - 0.0130042 * T) * Math.PI / 180;
    const dec = Math.asin(Math.sin(beta) * Math.cos(eps) + Math.cos(beta) * Math.sin(eps) * Math.sin(lambda));
    const ra = Math.atan2(Math.sin(lambda) * Math.cos(eps) - Math.tan(beta) * Math.sin(eps), Math.cos(lambda));
    return { ra: normaliza(ra * 180 / Math.PI), dec: dec * 180 / Math.PI };
  }
  function moonPhase(date) {
    const s = sunEquatorial(date), m = moonEquatorial(date);
    return normaliza(m.ra - s.ra) / 360;
  }
  return { gastDeg, sunEquatorial, moonEquatorial, moonPhase };
})();

const SIZE = 800, CX = 400, CY = 400, R = 372;
const proj = d3.geoAzimuthalEquidistant().rotate([0, -90]).scale(R / Math.PI).translate([CX, CY]).clipAngle(180);
const path = d3.geoPath(proj);

const mapWrap = document.getElementById("mapwrap");
const skyGroup = document.getElementById("skyGroup");
const clockGroup = document.getElementById("clockGroup");
const sunIcon = document.getElementById("sun");
const solarShadow = document.getElementById("nightShadow");
const shadowCanvas = document.createElement("canvas");
shadowCanvas.width = shadowCanvas.height = 300;
const sctx = shadowCanvas.getContext("2d");
let shadowGrid = null;

let isRotating = false;
let startX = 0;
let startTime = 12;

async function init() {
  try {
    const topo = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
    const features = topojson.feature(topo, topo.objects.countries).features;
    d3.select("#landGroup").selectAll("path").data(features).join("path").attr("class", "c").attr("d", path);
    
    drawClockTicks();
    update();
    setInterval(() => { if(document.getElementById("btnNow").dataset.live === "true") syncNow(); }, 1000);
  } catch(e) {
    document.getElementById("clockDisplay").textContent = "Erro no mapa";
  }
}

function drawClockTicks() {
  const g = document.getElementById("clockTicks");
  g.innerHTML = "";
  for (let i = 0; i < 24; i++) {
    const ang = (i / 24) * 2 * Math.PI;
    const x = CX + 395 * Math.sin(ang);
    const y = CY - 395 * Math.cos(ang);
    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute("x", x); txt.setAttribute("y", y);
    txt.setAttribute("fill", "#a996c0"); txt.setAttribute("font-size", "10px");
    txt.setAttribute("text-anchor", "middle"); txt.setAttribute("dominant-baseline", "middle");
    txt.textContent = i.toString().padStart(2, '0');
    g.appendChild(txt);
  }
}

function getDate() {
  return new Date(
    document.getElementById("inputYear").value, 
    document.getElementById("inputMonth").value - 1, 
    document.getElementById("inputDay").value, 
    Math.floor(document.getElementById("timeSlider").value), 
    (document.getElementById("timeSlider").value % 1) * 60
  );
}

function update() {
  const date = getDate();
  const sun = Astro.sunEquatorial(date);
  const moon = Astro.moonEquatorial(date);
  const phase = Astro.moonPhase(date);
  const sidereal = Astro.gastDeg(date);

  const sunLon = ((sun.ra - sidereal + 540) % 360) - 180;
  const angle = -sunLon; 

  skyGroup.setAttribute("transform", `rotate(${angle} 400 400)`);
  clockGroup.setAttribute("transform", `rotate(${angle} 400 400)`);

  const sunX = CX + (R * (90 - sun.dec) / 180) * Math.sin(sun.ra * Math.PI / 180);
  const sunY = CY - (R * (90 - sun.dec) / 180) * Math.cos(sun.ra * Math.PI / 180);
  sunIcon.setAttribute("cx", sunX); sunIcon.setAttribute("cy", sunY);

  const moonX = CX + (R * (90 - moon.dec) / 180) * Math.sin(moon.ra * Math.PI / 180);
  const moonY = CY - (R * (90 - moon.dec) / 180) * Math.cos(moon.ra * Math.PI / 180);
  document.getElementById("moon").setAttribute("cx", moonX); document.getElementById("moon").setAttribute("cy", moonY);
  document.getElementById("moonClipCircle").setAttribute("cx", moonX); document.getElementById("moonClipCircle").setAttribute("cy", moonY);

  const moonShadow = document.getElementById("moonShadow");
  const angleToSun = Math.atan2(sunY - moonY, sunX - moonX);
  const dist = (1 - phase) * 24;
  moonShadow.setAttribute("cx", moonX - Math.cos(angleToSun) * dist);
  moonShadow.setAttribute("cy", moonY - Math.sin(angleToSun) * dist);

  drawShadow(date, sun, sunLon);

  document.getElementById("clockDisplay").textContent = date.toLocaleTimeString().slice(0,5);
}

function drawShadow(date, sun, sunLon) {
  if (!shadowGrid) {
    shadowGrid = new Array(300 * 300);
    for (let y = 0; y < 300; y++) {
      for (let x = 0; x < 300; x++) {
        shadowGrid[y * 300 + x] = proj.invert([x * (800/300), y * (800/300)]);
      }
    }
  }
  
  const imgData = sctx.createImageData(300, 300);
  const sunDecRad = sun.dec * Math.PI / 180;

  for (let y = 0; y < 300; y++) {
    for (let x = 0; x < 300; x++) {
      const geo = shadowGrid[y * 300 + x];
      if (!geo) continue;
      
      const lat = geo[1] * Math.PI / 180;
      const lon = geo[0] * Math.PI / 180;
      const hourAngle = lon - sunLon * Math.PI / 180;
      
      const cosZenith = Math.sin(lat) * Math.sin(sunDecRad) + Math.cos(lat) * Math.cos(sunDecRad) * Math.cos(hourAngle);
      const elev = Math.asin(Math.max(-1, Math.min(1, cosZenith))) * 180 / Math.PI;
      
      let alpha = 0;
      if (elev < 0) {
        if (elev >= -6) alpha = 60;
        else if (elev >= -12) alpha = 120;
        else alpha = 190;
      }
      
      const idx = (y * 300 + x) * 4;
      imgData.data[idx] = 3; imgData.data[idx+1] = 6; imgData.data[idx+2] = 22;
      imgData.data[idx+3] = alpha;
    }
  }
  sctx.putImageData(imgData, 0, 0);
  solarShadow.setAttribute("href", shadowCanvas.toDataURL("image/png"));
}

// --- CONTROLES DE TEMPO E ARRASTAR ---
document.getElementById("timeSlider").addEventListener("input", () => {
  document.getElementById("btnNow").dataset.live = "false";
  update();
});
document.getElementById("inputYear").addEventListener("change", update);
document.getElementById("inputMonth").addEventListener("change", update);
document.getElementById("inputDay").addEventListener("change", update);

document.getElementById("lockToggle").addEventListener("change", (e) => {
  if (e.target.checked) mapWrap.classList.add("locked");
  else mapWrap.classList.remove("locked");
});

mapWrap.addEventListener("pointerdown", (e) => {
  if (document.getElementById("lockToggle").checked) return; // Se travado, não faz nada
  isRotating = true;
  startX = e.clientX;
  startTime = parseFloat(document.getElementById("timeSlider").value);
  mapWrap.setPointerCapture(e.pointerId);
});

mapWrap.addEventListener("pointermove", (e) => {
  if (!isRotating) return;
  const dx = e.clientX - startX;
  // Arrastar 30 pixels = 1 hora (720 px = 24 horas)
  let newTime = startTime - (dx / 30);
  
  // Loop de 24 horas
  newTime = ((newTime % 24) + 24) % 24;
  
  document.getElementById("timeSlider").value = newTime;
  document.getElementById("btnNow").dataset.live = "false";
  update();
});

mapWrap.addEventListener("pointerup", () => { isRotating = false; });
mapWrap.addEventListener("pointercancel", () => { isRotating = false; });

document.getElementById("btnNow").addEventListener("click", () => {
  document.getElementById("btnNow").dataset.live = "true";
  syncNow();
});

function syncNow() {
  const d = new Date();
  document.getElementById("inputYear").value = d.getFullYear();
  document.getElementById("inputMonth").value = d.getMonth() + 1;
  document.getElementById("inputDay").value = d.getDate();
  document.getElementById("timeSlider").value = d.getHours() + d.getMinutes() / 60;
  update();
}

init();
</script>
</body>
</html>
