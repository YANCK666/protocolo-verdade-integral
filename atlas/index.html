<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Polar — Luz e Sombra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Young+Serif&display=swap">
<style>
:root {
  --bg: #0b0710; --panel: #15101c; --soft: #221a2e; --ink: #f0e9fb; --muted: #a996c0;
  --line: #3a2d4c; --sea: #110c18; --land: #2e2340; --accent: #c4a1f0; --sel: #e9b8ff;
  --green: #4ade80; --star: #fffbe6; --const: #4da6ff;
  --f-display: "Young Serif", Georgia, serif;
  --f-body: "Hanken Grotesk", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 4vw, 40px); margin-bottom: 6px; }
.lede { color: var(--muted); margin-bottom: 20px; max-width: 62ch; }
.layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.mapcol { position: sticky; top: 16px; min-width: 0; }
.mapwrap { position: relative; width: min(100%, calc(100vh - 100px)); margin: 0 auto; user-select: none; touch-action: none; }
#map { display: block; width: 100%; height: auto; }
.sea { fill: var(--sea); }
.c { fill: var(--land); stroke: var(--bg); stroke-width: .7; cursor: pointer; }
.c:hover { stroke: var(--ink); stroke-width: 1.4; }
.c.ring { fill: #e8def6 !important; stroke: var(--line); stroke-width: 1; }
.grid-line { stroke: var(--green); stroke-width: 1.2; opacity: 0.4; pointer-events: none; }
.grid-circle { fill: none; stroke: var(--green); stroke-width: 1; opacity: 0.3; pointer-events: none; }
.ring { fill: none; stroke: var(--line); stroke-width: 2; pointer-events: none; }
.pole { fill: var(--accent); pointer-events: none; filter: drop-shadow(0 0 6px var(--accent)); }
.star { fill: var(--star); pointer-events: none; }
.constellation-line { stroke: var(--const); stroke-width: 1.5; opacity: 0.8; fill: none; pointer-events: none; }
.sun-dot { fill: #ffcc00; filter: drop-shadow(0 0 20px #ffcc00); pointer-events: none; }
.panel { min-width: 0; }
.layerbox { margin: 12px 0 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.layerhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.layerhead strong { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.layergrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.layeritem { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 12px; }
.layeritem input { accent-color: var(--accent); }
.time-control { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.time-control label { display: block; font-size: 12px; font-family: var(--f-mono); text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.time-control input { width: 100%; accent-color: var(--accent); }
.time-display { font-family: var(--f-mono); color: var(--accent); text-align: right; font-size: 14px; margin-top: 4px; }
@media (max-width: 979px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .mapcol { position: static; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Atlas Polar</h1>
    <p class="lede">Iluminação solar calculada pela projeção azimutal. A luz forma a ferradura; a sombra é o complemento.</p>
  </header>
  <main class="layout">
    <section class="mapcol">
      <div class="mapwrap" id="mapwrap">
        <svg id="map" viewBox="0 0 800 800">
          <defs>
            <clipPath id="mapclip"><circle cx="400" cy="400" r="372"/></clipPath>
          </defs>
          <circle class="sea" cx="400" cy="400" r="372" />
          <g id="worldGroup" clip-path="url(#mapclip)">
            <g id="landGroup"></g>
            <image id="solarLight" x="0" y="0" width="800" height="800" preserveAspectRatio="none" style="pointer-events:none" />
            <image id="nightShadow" x="0" y="0" width="800" height="800" preserveAspectRatio="none" style="pointer-events:none" />
            <g id="skyLayer">
              <g id="constellations"></g>
              <g id="stars"></g>
              <g id="starLabels"></g>
            </g>
            <circle id="sun" class="sun-dot" r="12" />
          </g>
          <g id="staticGroup">
            <g id="gridLayer">
              <circle class="grid-circle" cx="400" cy="400" r="120" />
              <circle class="grid-circle" cx="400" cy="400" r="240" />
              <circle class="grid-circle" cx="400" cy="400" r="360" />
              <line class="grid-line" x1="400" y1="40" x2="400" y2="760" />
              <line class="grid-line" x1="40" y1="400" x2="760" y2="400" />
              <polygon points="400,40 711.8,580 88.2,580" fill="none" class="grid-line" style="opacity:0.6;" />
              <polygon points="711.8,220 400,760 88.2,220" fill="none" class="grid-line" style="opacity:0.6;" />
              <circle class="ring" cx="400" cy="400" r="370" />
            </g>
            <circle class="pole" cx="400" cy="400" r="5" />
          </g>
        </svg>
      </div>
      <section class="layerbox">
        <div class="layerhead"><strong>Camadas</strong><span>ligar / desligar</span></div>
        <div class="layergrid">
          <label class="layeritem"><input type="checkbox" id="layerLight" checked> Luz</label>
          <label class="layeritem"><input type="checkbox" id="layerDark" checked> Sombra</label>
          <label class="layeritem"><input type="checkbox" id="layerSun" checked> Sol</label>
          <label class="layeritem"><input type="checkbox" id="layerGrid" checked> Grade</label>
        </div>
      </section>
      <section class="time-control">
        <label for="timeSlider">Hora (UTC)</label>
        <input id="timeSlider" type="range" min="0" max="23" value="12" step="1">
        <div class="time-display" id="timeDisplay">12:00 UTC</div>
      </section>
      <section class="time-control">
        <label for="dateInput">Data</label>
        <input id="dateInput" type="date" value="2026-11-07">
      </section>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(function () {
  "use strict";

  const SIZE = 800, CX = 400, CY = 400, R = 372;
  const proj = d3.geoAzimuthalEquidistant()
    .rotate([0, -90])
    .scale(R / Math.PI)
    .translate([CX, CY])
    .clipAngle(180);
  const path = d3.geoPath(proj);

  const solarLight = document.getElementById("solarLight");
  const solarShadow = document.getElementById("nightShadow");
  const sunIcon = document.getElementById("sun");
  const timeSlider = document.getElementById("timeSlider");
  const timeDisplay = document.getElementById("timeDisplay");
  const dateInput = document.getElementById("dateInput");

  const RES = 400;
  const lightCanvas = document.createElement("canvas");
  const shadowCanvas = document.createElement("canvas");
  lightCanvas.width = lightCanvas.height = RES;
  shadowCanvas.width = shadowCanvas.height = RES;
  const lctx = lightCanvas.getContext("2d");
  const sctx = shadowCanvas.getContext("2d");

  function declination(date) {
    const start = new Date(date.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((date - start) / 86400000);
    return 23.44 * Math.sin((360 / 365.2422) * (dayOfYear - 80) * Math.PI / 180);
  }

  function drawLight(utcHour, date) {
    const W = RES, H = RES;
    const lightData = lctx.createImageData(W, H);
    const shadowData = sctx.createImageData(W, H);

    const decDeg = declination(date);
    const decRad = decDeg * Math.PI / 180;
    const sinDec = Math.sin(decRad);
    const cosDec = Math.cos(decRad);

    // Longitude do ponto subsolar (onde é meio-dia)
    const subsolarLon = 180 - utcHour * 15;

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const px = x * (SIZE / W);
        const py = y * (SIZE / H);
        const dx = px - CX;
        const dy = py - CY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const idx = (y * W + x) * 4;

        if (dist > R) continue;

        const geo = proj.invert([px, py]);
        if (!geo) continue;

        const lon = geo[0];
        const latRad = geo[1] * Math.PI / 180;
        const ha = (lon - subsolarLon) * Math.PI / 180;

        const solarHeight = Math.sin(latRad) * sinDec + Math.cos(latRad) * cosDec * Math.cos(ha);

        if (solarHeight >= 0) {
          // Luz: amarelo translúcido
          lightData.data[idx] = 255;
          lightData.data[idx + 1] = 220;
          lightData.data[idx + 2] = 120;
          lightData.data[idx + 3] = 70;
        } else {
          // Sombra: azul escuro
          shadowData.data[idx] = 3;
          shadowData.data[idx + 1] = 6;
          shadowData.data[idx + 2] = 22;
          shadowData.data[idx + 3] = 210;
        }
      }
    }

    lctx.putImageData(lightData, 0, 0);
    sctx.putImageData(shadowData, 0, 0);
    solarLight.setAttribute("href", lightCanvas.toDataURL("image/png"));
    solarShadow.setAttribute("href", shadowCanvas.toDataURL("image/png"));

    // Posiciona o Sol no ponto subsolar
    const sunPos = proj([subsolarLon, decDeg]);
    if (sunPos) {
      sunIcon.setAttribute("cx", sunPos[0]);
      sunIcon.setAttribute("cy", sunPos[1]);
    }
  }

  function update() {
    const h = parseFloat(timeSlider.value);
    const d = new Date(dateInput.value + "T00:00:00Z");
    timeDisplay.textContent = `${String(Math.floor(h)).padStart(2, "0")}:00 UTC`;
    drawLight(h, d);
  }

  timeSlider.addEventListener("input", update);
  dateInput.addEventListener("change", update);

  // Controles de camada
  document.getElementById("layerLight").addEventListener("change", e => {
    solarLight.style.display = e.target.checked ? "" : "none";
  });
  document.getElementById("layerDark").addEventListener("change", e => {
    solarShadow.style.display = e.target.checked ? "" : "none";
  });
  document.getElementById("layerSun").addEventListener("change", e => {
    sunIcon.style.display = e.target.checked ? "" : "none";
  });
  document.getElementById("layerGrid").addEventListener("change", e => {
    document.getElementById("gridLayer").style.display = e.target.checked ? "" : "none";
  });

  // Carrega os países
  d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(topo => {
    const features = topojson.feature(topo, topo.objects.countries).features;
    const g = d3.select("#landGroup");
    const antarctica = features.find(f => f.id === "010");
    if (antarctica) {
      g.append("path").datum(antarctica).attr("class", "c ring").attr("d", path);
    }
    const countries = features.filter(f => f.id !== "010");
    g.selectAll("path.country")
      .data(countries)
      .join("path")
      .attr("class", "c country")
      .attr("d", path);
    update();
  });
})();
</script>
</body>
</html>
