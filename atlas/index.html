<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MAPA LUCIFERIANO — Atlas Multicamadas</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Young+Serif&display=swap">
  <style>
    :root {
      --bg: #0f0a14;
      --panel: #1a1224;
      --soft: #2a1d3a;
      --ink: #f1e8fc;
      --muted: #b7a5cb;
      --line: #49345e;
      --sea: #1a1228;
      --land: #3d2d52;
      --accent: #c2a0ef;
      --on-accent: #1a1224;
      --sel: #f0b5ff;
      --f-display: "Young Serif", Georgia, serif;
      --f-body: "Hanken Grotesk", system-ui, sans-serif;
      --f-mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-body);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    h1 {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: clamp(26px, 4vw, 36px);
      margin-bottom: 6px;
    }

    .lede { color: var(--muted); margin-bottom: 20px; max-width: 70ch; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, 1fr);
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
    }

    .mapcol { position: sticky; top: 12px; }
    .mapwrap {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background: var(--sea);
      border: 1px solid var(--line);
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
