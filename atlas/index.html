<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Polar — Relógio Celeste</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Young+Serif&display=swap">
<style>
/* O CSS PERMANECE O MESMO DO SEU SCRIPT ORIGINAL */
:root {
  --bg: #0b0710; --panel: #15101c; --soft: #221a2e; --ink: #f0e9fb; --muted: #a996c0;
  --line: #3a2d4c; --sea: #110c18; --land: #2e2340; --accent: #c4a1f0; --sel: #e9b8ff;
  --green: #4ade80; --star: #fffbe6; --const: #4da6ff;
  --f-display: "Young Serif", Georgia, serif; --f-body: "Hanken Grotesk", system-ui, sans-serif; --f-mono: "IBM Plex Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px 40px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 4vw, 40px); }
.layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.mapcol { position: sticky; top: 16px; min-width: 0; }
.mapwrap { position: relative; width: min(100%, calc(100vh - 100px)); margin: 0 auto; overflow: hidden; background: var(--bg); border-radius: 50%; }
#map { display: block; width: 100%; height: 100%; }
.sea { fill: var(--sea); }
.c { fill: var(--land); stroke: var(--bg); stroke-width: .7; cursor: pointer; }
.c.sel { stroke: var(--sel); stroke-width: 2.6; }
.c.ring { fill: #e8def6 !important; stroke: var(--line); stroke-width: 1; }
.tropic-circle { fill:none; stroke-width:1.7; opacity:.82; pointer-events:none; }
.tropic-north { stroke:#ef4444; } .tropic-equator { stroke:#eab308; } .tropic-south { stroke:#3b82f6; }
.star { fill: var(--star); pointer-events: none; } .star-bright { fill: #fff; filter: drop-shadow(0 0 3px #fff); }
.sun-dot { fill: #ffcc00; filter: drop-shadow(0 0 20px #ffcc00); pointer-events: none; }
.moon-dot { fill: #e0e0e0; filter: drop-shadow(0 0 15px #fff); pointer-events: none; }
.moon-shadow { fill: rgba(0, 0, 0, 0.8); pointer-events: none; }
.clock-display { margin-top: 16px; padding: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; text-align: center; }
.clock-display .date { font-size: 14px; color: var(--accent); } .clock-display .time { font-size: 28px; font-weight: 700; }
.panel { min-width: 0; }
.layerbox { margin: 12px 0 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.layergrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.layeritem { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.time-control { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.time-display { color: var(--accent); font-family: var(--f-mono); font-weight: 600; margin: 8px 0; }
.tooltip { position: absolute; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-family: var(--f-mono); font-size: 12px; display: none; z-index: 100; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>Atlas Polar</h1><p class="lede">Relógio celeste de precisão. O Sol é o eixo.</p></div>
    <p class="stats" id="stats">Carregando mapa local...</p>
  </header>
  <main class="layout">
    <section class="mapcol">
      <div class="mapwrap" id="mapwrap">
        <svg id="map" viewBox="0 0 800 800">
          <defs>
            <clipPath id="mapclip"><circle cx="400" cy="400" r="372"/></clipPath>
            <clipPath id="moonclip"><circle id="moonClipCircle" cx="0" cy="0" r="12"/></clipPath>
          </defs>
          
          <g id="wholeMap">
            <circle class="sea" cx="400" cy="400" r="372" />
            <!-- O MAPA FICA FIXO (A TERRA NÃO GIRA) -->
            <g id="landGroup" clip-path="url(#mapclip)"></g>

            <!-- O CÉU (ESTRELAS, SOL E LUA) FICA AQUI, E VAI GIRAR -->
            <g id="skyGroup" clip-path="url(#mapclip)" pointer-events="none">
              <g id="starsGroup"></g>
              <g id="sunLayer"><circle id="sun" class="sun-dot" r="12" /></g>
              <g id="moonLayer">
                <circle id="moon" class="moon-dot" r="12" />
                <circle id="moonShadow" class="moon-shadow" r="12" clip-path="url(#moonclip)" />
              </g>
            </g>

            <!-- A SOMBRA E O ANEL -->
            <image id="nightShadow" x="0" y="0" width="800" height="800" preserveAspectRatio="none" style="pointer-events:none" clip-path="url(#mapclip)" />
            
            <g id="staticGroup">
              <!-- O ANEL DE 24H GIRA JUNTO COM O CÉU -->
              <g id="clockGroup">
                <circle cx="400" cy="400" r="385" fill="none" stroke="var(--line)" stroke-width="1.5" />
                <g id="clockTicks"></g>
              </g>
              
              <g id="gridLayer">
                <circle class="tropic-circle tropic-north" cx="400" cy="400" r="137.5" />
                <circle class="tropic-circle tropic-equator" cx="400" cy="400" r="186" />
                <circle class="tropic-circle tropic-south" cx="400" cy="400" r="234.5" />
              </g>
              <circle class="pole" cx="400" cy="400" r="5" fill="var(--accent)" />
              <text x="400" y="12" text-anchor="middle" fill="var(--accent)" font-size="12" font-family="var(--f-mono)">N</text>
            </g>
          </g>
        </svg>
        <div id="timeTooltip" class="tooltip"></div>
      </div>
      
      <section class="layerbox">
        <div class="layerhead"><strong>Camadas</strong></div>
        <div class="layergrid" id="layerControls">
          <label class="layeritem"><input type="checkbox" data-layer="borders" checked> Países</label>
          <label class="layeritem"><input type="checkbox" data-layer="tropics" checked> Trópicos</label>
          <label class="layeritem"><input type="checkbox" data-layer="stars" checked> Céu Estelar</label>
          <label class="layeritem"><input type="checkbox" data-layer="dark" checked> Sombra (Noite)</label>
        </div>
      </section>

      <section class="time-control">
        <div class="layerhead"><strong>Máquina do Tempo</strong></div>
        <div class="time-machine" style="display:flex; gap:8px; margin-bottom:10px;">
          <input id="inputYear" type="number" value="2026" style="width:80px; padding:8px; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:6px;">
          <input id="inputMonth" type="number" value="11" min="1" max="12" style="width:60px; padding:8px; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:6px;">
          <input id="inputDay" type="number" value="23" min="1" max="31" style="width:60px; padding:8px; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:6px;">
        </div>
        <div class="time-display" id="timeDisplay">12:00</div>
        <input id="timeSlider" type="range" min="0" max="23.99" value="12" step="0.01" style="width:100%; accent-color:var(--accent);">
      </section>
    </section>

    <section class="panel">
      <div class="clock-display">
        <div class="date" id="clockDate">--/--/----</div>
        <div class="time" id="clockTime">--:--:--</div>
      </div>
    </section>
  </main>
</div>

<!-- NOSSOS SCRIPTS LOCAIS -->
<script src="dados.js"></script>
<script src="astronomia.js" defer></script>
<!-- O D3 É NECESSÁRIO APENAS PARA DESENHAR O MAPA E A PROJEÇÃO (PODE SER BAIXADO LOCALMENTE DEPOIS) -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

<script>
(function () {
  "use strict";

  const SIZE = 800, CX = 400, CY = 400, R = 372;
  const proj = d3.geoAzimuthalEquidistant().rotate([0, -90]).scale(R / Math.PI).translate([CX, CY]).clipAngle(180);
  const path = d3.geoPath(proj);

  const mapWrap = document.getElementById("mapwrap");
  const skyGroup = document.getElementById("skyGroup");
  const clockGroup = document.getElementById("clockGroup");
  const solarShadow = document.getElementById("nightShadow");
  const sunIcon = document.getElementById("sun");
  
  const timeSlider = document.getElementById("timeSlider");
  const inputYear = document.getElementById("inputYear");
  const inputMonth = document.getElementById("inputMonth");
  const inputDay = document.getElementById("inputDay");

  const RES = 300;
  let shadowGeoGrid = null;
  const shadowCanvas = document.createElement("canvas");
  shadowCanvas.width = shadowCanvas.height = RES;
  const sctx = shadowCanvas.getContext("2d");

  // 1. CARREGA O MAPA LOCAL
  async function initMap() {
    try {
      const topo = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
      const features = topojson.feature(topo, topo.objects.countries).features;
      const g = d3.select("#landGroup");
      
      // Desenha os países
      g.selectAll("path.country")
        .data(features)
        .join("path")
        .attr("class", "c country")
        .attr("d", path);
        
      document.getElementById("stats").textContent = "Mapa carregado (Offline)";
      drawClock();
      update();
    } catch (e) {
      document.getElementById("stats").textContent = "Erro ao carregar mapa.json: " + e.message;
      console.error(e);
    }
  }

  // 2. O ÂNGULO DE ROTAÇÃO DO CÉU
  function getRotationAngle(date) {
    const sun = Astro.sunEquatorial(date);
    const sidereal = Astro.gastDeg(date);
    // O ângulo onde o Sol está (longitude)
    const sunLon = ((sun.ra - sidereal + 540) % 360) - 180;
    // Queremos que o Sol fique no topo (12h), então giramos o céu pelo ângulo negativo do Sol
    return -sunLon; 
  }

  // 3. POSICIONA OS ASTROS NO CÉU (SEM GAST)
  function drawSky(date) {
    const sun = Astro.sunEquatorial(date);
    const moon = Astro.moonEquatorial(date);
    const phase = Astro.moonPhase(date);

    // No céu puro, a longitude é apenas RA (0 a 360) e a latitude é Dec.
    // A rotação (gast) já está sendo aplicada no grupo inteiro.
    
    // Sol no topo (12h) = RA mapeado direto
    const sunX = CX + (R * (90 - sun.dec) / 180) * Math.sin(sun.ra * Math.PI / 180);
    const sunY = CY - (R * (90 - sun.dec) / 180) * Math.cos(sun.ra * Math.PI / 180);
    sunIcon.setAttribute("cx", sunX);
    sunIcon.setAttribute("cy", sunY);

    // Lua
    const moonX = CX + (R * (90 - moon.dec) / 180) * Math.sin(moon.ra * Math.PI / 180);
    const moonY = CY - (R * (90 - moon.dec) / 180) * Math.cos(moon.ra * Math.PI / 180);
    document.getElementById("moon").setAttribute("cx", moonX);
    document.getElementById("moon").setAttribute("cy", moonY);
    document.getElementById("moonClipCircle").setAttribute("cx", moonX);
    document.getElementById("moonClipCircle").setAttribute("cy", moonY);

    // Sombra da Lua (Fase)
    const moonShadow = document.getElementById("moonShadow");
    const angleToSun = Math.atan2(sunY - moonY, sunX - moonX);
    const shadowDist = (1 - phase) * 24;
    moonShadow.setAttribute("cx", moonX - Math.cos(angleToSun) * shadowDist);
    moonShadow.setAttribute("cy", moonY - Math.sin(angleToSun) * shadowDist);
  }

  // 4. DESENHA A SOMBRA DA TERRA (Sempre oposta ao Sol)
  function drawShadow(date) {
    const W = RES, H = RES;
    if (!shadowGeoGrid) {
      shadowGeoGrid = new Array(W * H);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          shadowGeoGrid[y * W + x] = proj.invert([x * (SIZE/W), y * (SIZE/H)]);
        }
      }
    }

    const sun = Astro.sunEquatorial(date);
    const sidereal = Astro.gastDeg(date);
    const sunLon = ((sun.ra - sidereal + 540) % 360) - 180;
    const sunDecRad = sun.dec * Math.PI / 180;
    const shd = sctx.createImageData(W, H);

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const geo = shadowGeoGrid[y * W + x];
        if (!geo) continue;
        const lat = geo[1] * Math.PI / 180;
        const lon = geo[0] * Math.PI / 180;
        const hourAngle = lon - sunLon * Math.PI / 180;
        const cosZenith = Math.sin(lat) * Math.sin(sunDecRad) + Math.cos(lat) * Math.cos(sunDecRad) * Math.cos(hourAngle);
        const elev = Math.asin(Math.max(-1, Math.min(1, cosZenith))) * 180 / Math.PI;
        
        // Transição de noite (técnica)
        let alpha = 0;
        if (elev < 0) {
          if (elev >= -6) alpha = 50;      // Crepúsculo civil
          else if (elev >= -12) alpha = 110; // Náutico
          else alpha = 190;                // Noite plena
        }
        const idx = (y * W + x) * 4;
        shd.data[idx] = 3; shd.data[idx+1] = 6; shd.data[idx+2] = 22;
        shd.data[idx+3] = alpha;
      }
    }
    sctx.putImageData(shd, 0, 0);
    solarShadow.setAttribute("href", shadowCanvas.toDataURL("image/png"));
  }

  // 5. O RELÓGIO
  function drawClock() {
    const ticksGroup = document.getElementById("clockTicks");
    ticksGroup.innerHTML = "";
    for (let i = 0; i < 24; i++) {
      const angle = (i / 24) * 2 * Math.PI;
      const tx = CX + 393 * Math.sin(angle);
      const ty = CY - 393 * Math.cos(angle);
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", tx); text.setAttribute("y", ty);
      text.setAttribute("fill", "var(--muted)"); text.setAttribute("font-size", "10px");
      text.setAttribute("text-anchor", "middle"); text.setAttribute("dominant-baseline", "middle");
      text.textContent = i.toString().padStart(2, '0');
      ticksGroup.appendChild(text);
    }
  }

  // 6. UPDATE GERAL
  function update() {
    const date = new Date(inputYear.value, inputMonth.value - 1, inputDay.value);
    date.setHours(Math.floor(timeSlider.value), (timeSlider.value % 1) * 60, 0);

    const angle = getRotationAngle(date);
    
    // GIRA O CÉU E O ANEL JUNTOS
    skyGroup.setAttribute("transform", `rotate(${angle} 400 400)`);
    clockGroup.setAttribute("transform", `rotate(${angle} 400 400)`);

    drawSky(date);
    drawShadow(date);

    document.getElementById("clockDate").textContent = date.toLocaleDateString();
    document.getElementById("clockTime").textContent = date.toLocaleTimeString();
    document.getElementById("timeDisplay").textContent = date.toTimeString().slice(0, 5);
  }

  // Eventos da Máquina do Tempo
  timeSlider.addEventListener("input", update);
  inputYear.addEventListener("change", update);
  inputMonth.addEventListener("change", update);
  inputDay.addEventListener("change", update);
  
  document.getElementById("layerControls").addEventListener("change", (e) => {
    const key = e.target.dataset.layer, on = e.target.checked;
    if (key === "borders") document.getElementById("landGroup").style.display = on ? "" : "none";
    if (key === "tropics") document.getElementById("gridLayer").style.display = on ? "" : "none";
    if (key === "stars") document.getElementById("starsGroup").style.display = on ? "" : "none";
    if (key === "dark") solarShadow.style.display = on ? "" : "none";
  });

  initMap();
})();
</script>
</body>
</html>
