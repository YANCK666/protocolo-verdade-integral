<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script>
(function () {
  "use strict";

  const SIZE = 800, CX = 400, CY = 400, R = 372;
  const proj = d3.geoAzimuthalEquidistant().rotate([0, -90]).scale(R / Math.PI).translate([CX, CY]).clipAngle(180);
  const path = d3.geoPath(proj);
  let mapPaths = new Map();

  // Elementos
  const wholeMap = document.getElementById("wholeMap");
  const landGroup = document.getElementById("landGroup");
  const skyGroup = document.getElementById("skyGroup");
  const mapWrap = document.getElementById("mapwrap");
  const rotationCheckbox = document.querySelector('[data-layer="rotation"]');
  const sunMoveCheckbox = document.querySelector('[data-layer="sunMove"]');
  const btnReset = document.getElementById("btnReset");
  const btnNow = document.getElementById("btnNow");
  
  const starsGroup = document.getElementById("stars");
  const constGroup = document.getElementById("constellations");
  const labelsGroup = document.getElementById("starLabels");
  
  const solarLight = document.getElementById("solarLight");
  const solarShadow = document.getElementById("nightShadow");
  const sunIcon = document.getElementById("sun");
  const moonIcon = document.getElementById("moon");
  const moonShadow = document.getElementById("moonShadow");
  const moonClipCircle = document.getElementById("moonClipCircle");
  const timeSlider = document.getElementById("timeSlider");
  const timeDisplay = document.getElementById("timeDisplay");
  const dateInput = document.getElementById("dateInput");
  const timeTooltip = document.getElementById("timeTooltip");
  
  const clockDate = document.getElementById("clockDate");
  const clockTime = document.getElementById("clockTime");
  const clockLabel = document.getElementById("clockLabel");

  const RES = 400;
  const lightCanvas = document.createElement("canvas");
  const shadowCanvas = document.createElement("canvas");
  lightCanvas.width = lightCanvas.height = RES;
  shadowCanvas.width = shadowCanvas.height = RES;
  const lctx = lightCanvas.getContext("2d");
  const sctx = shadowCanvas.getContext("2d");

  const localOffsetHours = -new Date().getTimezoneOffset() / 60;

  let sunMoving = true;
  let simulationTime = new Date();

  let zoom = 1, panX = 0, panY = 0;
  const MIN_ZOOM = 1, MAX_ZOOM = 10;

  function applyMapTransform() {
    wholeMap.setAttribute("transform", `translate(${panX} ${panY}) translate(${CX} ${CY}) scale(${zoom}) translate(${-CX} ${-CY})`);
  }

  // --- CATÁLOGO DE ESTRELAS (Expandido) ---
  // Coordenadas J2000 (RA em horas, Dec em graus)
  const STARS = [
    // Cruzeiro do Sul
    { name: "Acrux", ra: 12.443, dec: -63.099, bright: true },
    { name: "Mimosa", ra: 12.795, dec: -59.689, bright: true },
    { name: "Gacrux", ra: 12.519, dec: -57.113, bright: true },
    { name: "Imai", ra: 12.252, dec: -58.749, bright: true },
    // Órion
    { name: "Betelgeuse", ra: 5.919, dec: 7.407, bright: true },
    { name: "Rigel", ra: 5.242, dec: -8.202, bright: true },
    { name: "Bellatrix", ra: 5.418, dec: 6.350, bright: true },
    { name: "Alnitak", ra: 5.679, dec: -1.943 },
    { name: "Alnilam", ra: 5.604, dec: -1.202 },
    { name: "Mintaka", ra: 5.533, dec: -0.299 },
    // Ursa Maior
    { name: "Dubhe", ra: 11.062, dec: 61.751, bright: true },
    { name: "Merak", ra: 11.031, dec: 56.382 },
    { name: "Phecda", ra: 11.897, dec: 53.695 },
    { name: "Megrez", ra: 12.257, dec: 57.033 },
    { name: "Alioth", ra: 12.900, dec: 55.960 },
    { name: "Mizar", ra: 13.399, dec: 54.925 },
    { name: "Alkaid", ra: 13.792, dec: 49.313 },
    // Polaris
    { name: "Polaris", ra: 2.530, dec: 89.264, bright: true },
    // Sirius
    { name: "Sirius", ra: 6.752, dec: -16.716, bright: true }
  ];

  const CONSTELLATIONS = [
    ["Acrux", "Gacrux", "Mimosa", "Imai", "Acrux"],
    ["Betelgeuse", "Bellatrix", "Rigel", "Alnitak", "Alnilam", "Mintaka", "Rigel"],
    ["Dubhe", "Merak", "Phecda", "Megrez", "Dubhe", "Megrez", "Alioth", "Mizar", "Alkaid"]
  ];

  // Função para obter Tempo Sideral Local (LST) aproximado para rotação estelar
  // Uma aproximação melhor seria usar Astronomy.SiderealTime, mas para visualização a rotação baseada em UTC é suficiente.
  function getSiderealRotation(date) {
    const jd = date.getTime() / 86400000 + 2440587.5;
    const T = (jd - 2451545.0) / 36525.0;
    let gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T;
    gmst = ((gmst % 360) + 360) % 360;
    // A projeção polar tem o Polo Norte no centro. Para o céu girar corretamente,
    // rotacionamos o grupo de estrelas pelo GMST.
    return gmst;
  }

  function drawStars(date) {
    starsGroup.innerHTML = "";
    constGroup.innerHTML = "";
    labelsGroup.innerHTML = "";

    // Rotação baseada no Tempo Sideral (mais preciso que a hora local)
    const rotationDeg = getSiderealRotation(date);
    const starPositions = {};

    STARS.forEach(star => {
      // Projeção Polar: RA é o ângulo, Dec define o raio
      // O centro (Polo Norte) é Dec +90. A borda é Dec -90.
      // O raio é proporcional a (90 - dec).
      const rho = R * (90 - star.dec) / 180;
      
      // Ângulo: RA em graus + rotação sideral. 
      // Na projeção padrão, RA=0h fica para baixo (Sul) e aumenta no sentido anti-horário? 
      // Vamos ajustar para que o céu gire naturalmente.
      const angleDeg = (star.ra * 15) + rotationDeg;
      const angle = angleDeg * Math.PI / 180;
      
      // Ajuste para o mapa: Leste é direita (x), Norte é cima (y).
      // Projeção azimutal com centro no polo norte: RA 0h deve estar para baixo (ou para cima dependendo da convenção).
      // Vamos usar: x = rho * sin(angle), y = -rho * cos(angle). Isso coloca angle=0 no topo (Norte).
      // Para o céu, a rotação deve ser tal que as estrelas "girem" ao redor do polo.
      const x = CX + rho * Math.sin(angle);
      const y = CY - rho * Math.cos(angle);

      if (rho <= R) {
        starPositions[star.name] = [x, y];

        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", x);
        circle.setAttribute("cy", y);
        circle.setAttribute("r", star.bright ? 3.5 : 2);
        circle.setAttribute("class", star.bright ? "star star-bright" : "star");
        starsGroup.appendChild(circle);

        if (star.bright) {
          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("x", x + 6);
          label.setAttribute("y", y + 3);
          label.setAttribute("class", "star-label");
          label.textContent = star.name;
          labelsGroup.appendChild(label);
        }
      }
    });

    CONSTELLATIONS.forEach(chain => {
      const points = chain.map(name => starPositions[name]).filter(p => p);
      if (points.length > 1) {
        const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        polyline.setAttribute("points", points.map(p => p.join(",")).join(" "));
        polyline.setAttribute("class", "constellation-line");
        constGroup.appendChild(polyline);
      }
    });
  }

  function drawLight(date) {
    const W = RES, H = RES;
    const lightData = lctx.createImageData(W, H);
    const shadowData = sctx.createImageData(W, H);

    // Usa Astronomy Engine para obter a posição do Sol (Geocêntrica, Equador da data)
    const time = Astronomy.MakeTime(date);
    const sunEq = Astronomy.Equator(Astronomy.Body.Sun, time, null, true, true);
    const sunDec = sunEq.dec; // Graus
    const sunRa = sunEq.ra * 15; // Converter horas para graus

    // Para a luz solar, precisamos do ponto subsolar (latitude = declinação, longitude = baseada em RA + GMST)
    // Uma aproximação robusta: O Sol está sobre a longitude onde o Tempo Solar Local é 12h.
    // A longitude subsolar é aproximadamente: 180 - (UTC_hours * 15) + EquationOfTime_minutes / 4
    // Vamos usar a posição do Sol calculada pela biblioteca para maior precisão.
    // A longitude subsolar pode ser derivada do RA do Sol e do GMST:
    // Longitude = RA_sun - GMST (em graus, normalizado)
    const jd = date.getTime() / 86400000 + 2440587.5;
    const T = (jd - 2451545.0) / 36525.0;
    let gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T;
    gmst = ((gmst % 360) + 360) % 360;
    
    // Subsolar longitude: onde o Sol está no zênite. 
    // A fórmula é: lon = 180 - (UTC_hours * 15) + EqTime (em graus)
    // Como já temos o RA do Sol, podemos usar: lon_sub = RA_sun - GMST (se RA_sun estiver em graus)
    // Mas isso dá a longitude do ponto onde o Sol está no meridiano. O ponto subsolar tem longitude = RA - GMST? 
    // Na verdade, o Tempo Sideral Local (LST) = GMST + longitude. O Sol está no meridiano quando LST = RA_sun.
    // Então longitude = RA_sun - GMST.
    let subsolarLon = (sunRa - gmst) % 360;
    if (subsolarLon > 180) subsolarLon -= 360;
    if (subsolarLon < -180) subsolarLon += 360;

    const sinDec = Math.sin(sunDec * Math.PI / 180);
    const cosDec = Math.cos(sunDec * Math.PI / 180);

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const px = x * (SIZE / W);
        const py = y * (SIZE / H);
        const dx = px - CX;
        const dy = py - CY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const idx = (y * W + x) * 4;

        if (dist > R) continue;

        const geo = proj.invert([px, py]);
        if (!geo) continue;

        const lon = geo[0];
        const latRad = geo[1] * Math.PI / 180;
        const ha = (lon - subsolarLon) * Math.PI / 180;

        const solarHeight = Math.sin(latRad) * sinDec + Math.cos(latRad) * cosDec * Math.cos(ha);

        if (solarHeight >= 0) {
          lightData.data[idx] = 255;
          lightData.data[idx + 1] = 220;
          lightData.data[idx + 2] = 120;
          lightData.data[idx + 3] = 70;
        } else {
          shadowData.data[idx] = 3;
          shadowData.data[idx + 1] = 6;
          shadowData.data[idx + 2] = 22;
          shadowData.data[idx + 3] = 210;
        }
      }
    }

    lctx.putImageData(lightData, 0, 0);
    sctx.putImageData(shadowData, 0, 0);
    solarLight.setAttribute("href", lightCanvas.toDataURL("image/png"));
    solarShadow.setAttribute("href", shadowCanvas.toDataURL("image/png"));

    // Desenha o ícone do Sol na posição correta (RA/Dec convertidos para a projeção polar)
    // Na projeção polar com centro no polo norte, a posição do Sol é:
    const sunRho = R * (90 - sunDec) / 180;
    const sunAngle = (sunRa + gmst) * Math.PI / 180; // Ajuste para a rotação do mapa
    // Precisamos alinhar o ângulo com a rotação das estrelas. 
    // Se as estrelas usam angleDeg = ra*15 + rotationDeg, o Sol deve usar o mesmo.
    // Mas rotationDeg para estrelas foi baseado em GMST. Vamos usar a mesma lógica.
    const sunAngleRad = ((sunRa) + gmst) * Math.PI / 180;
    const sunX = CX + sunRho * Math.sin(sunAngleRad);
    const sunY = CY - sunRho * Math.cos(sunAngleRad);

    if (sunRho <= R) {
      sunIcon.setAttribute("cx", sunX);
      sunIcon.setAttribute("cy", sunY);
    }

    // --- LUA ---
    const moonEq = Astronomy.Equator(Astronomy.Body.Moon, time, null, true, true);
    const moonDec = moonEq.dec;
    const moonRa = moonEq.ra * 15; // Graus

    const moonRho = R * (90 - moonDec) / 180;
    const moonAngleRad = ((moonRa) + gmst) * Math.PI / 180;
    const moonX = CX + moonRho * Math.sin(moonAngleRad);
    const moonY = CY - moonRho * Math.cos(moonAngleRad);

    if (moonRho <= R) {
      moonIcon.setAttribute("cx", moonX);
      moonIcon.setAttribute("cy", moonY);
      moonClipCircle.setAttribute("cx", moonX);
      moonClipCircle.setAttribute("cy", moonY);

      // Fase da Lua precisa
      const illum = Astronomy.Illumination(Astronomy.Body.Moon, time);
      const phase = illum.phase_fraction; // 0 = nova, 1 = cheia
      
      // Desenhar a sombra (simplificado para o círculo)
      // O diâmetro da sombra depende da fase. Se fase = 0.5, sombra cobre metade.
      // A posição da sombra: se fase > 0.5 (crescente/gibosa), sombra à esquerda (no hemisfério norte) ou direita (sul)?
      // Para simplificar visualmente, vamos deslocar o círculo de sombra.
      const shadowRadius = 12; // mesmo raio da lua
      const shadowOffset = (phase * 2 - 1) * shadowRadius * 1.5; // Ajuste visual
      
      moonShadow.setAttribute("cx", moonX + shadowOffset);
      moonShadow.setAttribute("cy", moonY);
      moonShadow.setAttribute("r", shadowRadius);
    }
  }

  function updateClock(date) {
    const d = String(date.getDate()).padStart(2, '0');
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const y = date.getFullYear();
    clockDate.textContent = `${d}/${m}/${y}`;
    
    const hh = String(date.getHours()).padStart(2, '0');
    const mm = String(date.getMinutes()).padStart(2, '0');
    const ss = String(date.getSeconds()).padStart(2, '0');
    clockTime.textContent = `${hh}:${mm}:${ss}`;
    
    clockLabel.textContent = localOffsetHours >= 0 ? `UTC+${localOffsetHours}` : `UTC${localOffsetHours}`;
  }

  function getSimulatedDate() {
    const localHour = parseFloat(timeSlider.value);
    const baseDay = new Date(dateInput.value + "T00:00:00");
    return new Date(baseDay.getTime() + (localHour * 3600000));
  }

  function update() {
    const date = getSimulatedDate();
    simulationTime = date;
    drawLight(date);
    drawStars(date);
    updateClock(date);
    
    const localHour = parseFloat(timeSlider.value);
    timeDisplay.textContent = `${String(Math.floor(localHour)).padStart(2, "0")}:${String(Math.floor((localHour % 1) * 60)).padStart(2, "0")} (Local)`;
  }

  function drawClock() {
    const ticksGroup = document.getElementById("clockTicks");
    // Limpar ticks antigos se houver
    ticksGroup.innerHTML = "";
    for (let i = 0; i < 24; i++) {
      const angle = (i / 24) * 2 * Math.PI;
      const textR = 393; 
      const tx = CX + textR * Math.sin(angle);
      const ty = CY - textR * Math.cos(angle);
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", tx); text.setAttribute("y", ty);
      text.setAttribute("fill", "var(--muted)");
      text.setAttribute("font-size", "10px");
      text.setAttribute("font-family", "var(--f-mono)");
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "middle");
      text.textContent = i.toString().padStart(2, '0');
      ticksGroup.appendChild(text);

      const isMajor = i % 6 === 0;
      const r1 = 372; const r2 = isMajor ? 382 : 377;
      const x1 = CX + r1 * Math.sin(angle); const y1 = CY - r1 * Math.cos(angle);
      const x2 = CX + r2 * Math.sin(angle); const y2 = CY - r2 * Math.cos(angle);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x1); line.setAttribute("y1", y1);
      line.setAttribute("x2", x2); line.setAttribute("y2", y2);
      line.setAttribute("stroke", isMajor ? "var(--accent)" : "var(--line)");
      line.setAttribute("stroke-width", isMajor ? "2" : "1");
      ticksGroup.appendChild(line);
    }
  }

  function drawTimezones() {
    const tzGroup = document.getElementById("timezoneLayer");
    if (!tzGroup) return;
    tzGroup.innerHTML = "";
    for (let i = 0; i < 24; i++) {
      const lon = i * 15 - 180;
      const p1 = proj([lon, 0]);
      const p2 = proj([lon, 85]);
      if (p1 && p2) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", p1[0]); line.setAttribute("y1", p1[1]);
        line.setAttribute("x2", p2[0]); line.setAttribute("y2", p2[1]);
        line.setAttribute("class", "timezone-line");
        tzGroup.appendChild(line);
      }
    }
  }

  function setupTooltip() {
    mapWrap.addEventListener("mousemove", (e) => {
      if (isRotating || isPanning) {
        timeTooltip.style.display = "none";
        return;
      }
      const rect = mapWrap.getBoundingClientRect();
      const rawX = ((e.clientX - rect.left) / rect.width) * SIZE;
      const rawY = ((e.clientY - rect.top) / rect.height) * SIZE;
      
      const invertedX = (rawX - panX - CX) / zoom + CX;
      const invertedY = (rawY - panY - CY) / zoom + CY;
      
      const geo = proj.invert([invertedX, invertedY]);
      
      if (!geo) {
        timeTooltip.style.display = "none";
        return;
      }

      const lon = geo[0];
      const offsetHours = Math.round(lon / 15);
      const utcHour = parseFloat(timeSlider.value) - localOffsetHours;
      const localHour = (utcHour + offsetHours + 24) % 24;
      
      const h = Math.floor(localHour);
      const m = Math.floor((localHour - h) * 60);
      
      timeTooltip.textContent = `Fuso ~${offsetHours >= 0 ? '+' : ''}${offsetHours} UTC | Local: ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      timeTooltip.style.display = "block";
      timeTooltip.style.left = (e.clientX - rect.left + 15) + "px";
      timeTooltip.style.top = (e.clientY - rect.top + 15) + "px";
    });

    mapWrap.addEventListener("mouseleave", () => {
      timeTooltip.style.display = "none";
    });
  }

  async function initMap() {
    try {
      const topo = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
      const features = topojson.feature(topo, topo.objects.countries).features;
      const g = d3.select("#landGroup");
      
      const antarctica = features.find(f => f.id === "010");
      if (antarctica) {
        g.append("path").datum(antarctica).attr("class", "c ring").attr("d", path);
      }

      const countries = features.filter(f => f.id !== "010");
      g.selectAll("path.country")
        .data(countries)
        .join("path")
        .attr("class", "c country")
        .attr("d", path)
        .attr("data-id", d => d.id)
        .each(function(d) { mapPaths.set(d.id, this); })
        .on("click", function(event, d) {
          if (isRotating || isPanning) return;
          d3.selectAll(".c").classed("sel", false);
          d3.select(this).classed("sel", true);
          showInfo(d.id, d.properties.name);
        });
        
      document.getElementById("stats").textContent = "Mapa carregado";
      
      drawClock();
      drawTimezones();
      setupTooltip();
      update();
      
      setInterval(() => {
        if (sunMoving && !isRotating && !isPanning) {
          const now = new Date();
          const localHour = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
          timeSlider.value = localHour;
          dateInput.value = now.toISOString().split('T')[0];
          update();
        }
      }, 1000);
      
    } catch (error) {
      console.error("Erro:", error);
      document.getElementById("stats").textContent = "Erro ao carregar.";
    }
  }

  let rotation = 0;
  let rotateEnabled = false;
  let isRotating = false;
  let isPanning = false;
  let startX = 0, startY = 0;
  let startRotation = 0;
  let startPanX = 0, startPanY = 0;
  let baseHour = 0;
  let baseDate = new Date();
  
  let initialPinchDistance = 0;
  let initialPinchZoom = 1;

  rotationCheckbox.addEventListener("change", () => {
    rotateEnabled = rotationCheckbox.checked;
    mapWrap.style.cursor = rotateEnabled ? "grab" : "default";
  });

  mapWrap.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    if (rotateEnabled) {
      isRotating = true;
      mapWrap.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startY = e.clientY;
      startRotation = rotation;
      baseHour = parseFloat(timeSlider.value);
      baseDate = new Date(dateInput.value + "T00:00:00");
      mapWrap.style.cursor = "grabbing";
    } else {
      isPanning = true;
      mapWrap.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startY = e.clientY;
      startPanX = panX;
      startPanY = panY;
      mapWrap.style.cursor = "grabbing";
    }
  });

  mapWrap.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch" && e.isPrimary === false) {
      if (e.touches && e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        
        if (initialPinchDistance === 0) {
          initialPinchDistance = dist;
          initialPinchZoom = zoom;
        } else {
          zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, initialPinchZoom * (dist / initialPinchDistance)));
          applyMapTransform();
        }
      }
      return;
    }

    if (isRotating) {
      const dx = e.clientX - startX;
      const deltaDegrees = -dx * 0.5;
      const deltaHours = deltaDegrees / 15;
      
      let totalHours = baseHour + deltaHours;
      let newHour = ((totalHours % 24) + 24) % 24;
      timeSlider.value = newHour;
      
      const dayOffset = Math.floor(totalHours / 24);
      const newDate = new Date(baseDate.getTime() + (dayOffset * 86400000));
      dateInput.value = newDate.toISOString().split('T')[0];
      
      rotation = startRotation + deltaDegrees;
      skyGroup.setAttribute("transform", `translate(${CX} ${CY}) rotate(${rotation}) translate(${-CX} ${-CY})`);
      
      update();
    } else if (isPanning) {
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      panX = startPanX + dx;
      panY = startPanY + dy;
      applyMapTransform();
    }
  });

  function stopInteraction() {
    isRotating = false;
    isPanning = false;
    initialPinchDistance = 0;
    mapWrap.style.cursor = rotateEnabled ? "grab" : "default";
  }
  mapWrap.addEventListener("pointerup", stopInteraction);
  mapWrap.addEventListener("pointercancel", stopInteraction);
  mapWrap.addEventListener("lostpointercapture", stopInteraction);

  mapWrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    applyMapTransform();
  }, { passive: false });

  document.getElementById("btnZoomIn").addEventListener("click", () => {
    zoom = Math.min(MAX_ZOOM, zoom * 1.3);
    applyMapTransform();
  });
  
  document.getElementById("btnZoomOut").addEventListener("click", () => {
    zoom = Math.max(MIN_ZOOM, zoom / 1.3);
    applyMapTransform();
  });

  document.getElementById("btnFullscreen").addEventListener("click", () => {
    if (!document.fullscreenElement) {
      mapWrap.requestFullscreen().catch(err => console.log(err));
    } else {
      document.exitFullscreen();
    }
  });

  btnReset.addEventListener("click", () => {
    zoom = 1; panX = 0; panY = 0;
    applyMapTransform();
    rotationCheckbox.checked = false;
    rotateEnabled = false;
    mapWrap.style.cursor = "default";
    rotation = 0;
    skyGroup.setAttribute("transform", "translate(400 400) rotate(0) translate(-400 -400)");
    update();
  });

  if (btnNow) {
    btnNow.addEventListener("click", () => {
      const now = new Date();
      const localHour = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
      timeSlider.value = localHour;
      dateInput.value = now.toISOString().split('T')[0];
      update();
    });
  }

  timeSlider.addEventListener("input", update);
  dateInput.addEventListener("change", update);

  sunMoveCheckbox.addEventListener("change", () => {
    sunMoving = sunMoveCheckbox.checked;
    if (sunMoving) {
      const now = new Date();
      const localHour = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
      timeSlider.value = localHour;
      dateInput.value = now.toISOString().split('T')[0];
      update();
    }
  });

  document.getElementById("layerControls").addEventListener("change", (e) => {
    const key = e.target.dataset.layer;
    const on = e.target.checked;

    if (key === "borders") {
      landGroup.style.display = on ? "" : "none";
    } else if (key === "graticule") {
      document.getElementById("gridCircles").style.display = on ? "" : "none";
    } else if (key === "grid") {
      document.getElementById("gridCross").style.display = on ? "" : "none";
    } else if (key === "star6") {
      document.getElementById("gridStar6").style.display = on ? "" : "none";
    } else if (key === "stars") {
      starsGroup.style.display = on ? "" : "none";
      constGroup.style.display = on ? "" : "none";
      labelsGroup.style.display = on ? "" : "none";
    } else if (key === "light") {
      solarLight.style.display = on ? "" : "none";
      sunLayer.style.display = on ? "" : "none";
    } else if (key === "dark") {
      solarShadow.style.display = on ? "" : "none";
    } else if (key === "moon") {
      moonLayer.style.display = on ? "" : "none";
    } else if (key === "timezones") {
      document.getElementById("timezoneLayer").style.display = on ? "" : "none";
    }
  });

  document.getElementById("q").addEventListener("input", (e) => {
    const term = e.target.value.toLowerCase();
    if (!term) return;

    mapPaths.forEach((el, id) => {
      const d = d3.select(el).datum();
      const nomeIngles = d.properties?.name;
      if (nomeIngles && nomeIngles.toLowerCase().includes(term)) {
        d3.selectAll(".c").classed("sel", false);
        d3.select(el).classed("sel", true);
        showInfo(id, nomeIngles);
      }
    });
  });

  function showInfo(id, nomeIngles) {
    const box = document.getElementById("countryInfo");
    const view = document.getElementById("view");
    box.style.display = "block";
    view.style.display = "none";
    
    const backBtn = `<button onclick="document.getElementById('countryInfo').style.display='none';document.getElementById('view').style.display='block';" style="border:0;background:none;color:var(--accent);cursor:pointer;margin-bottom:10px;">← Todos os países</button>`;
    
    box.innerHTML = `
      ${backBtn}
      <h2 style="font-family:var(--f-display); font-size:24px; margin-bottom:8px;">${nomeIngles}</h2>
    `;
  }

  applyMapTransform();
  initMap();

})();
</script>
